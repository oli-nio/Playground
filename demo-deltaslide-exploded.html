<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMIKAT — DeltaSlide / Exploded</title><style>*{box-sizing:border-box}html,body{margin:0;background:#deded9;color:#111;font-family:Arial,sans-serif;overflow:hidden}.top{position:fixed;z-index:5;left:24px;right:24px;top:22px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.13em;text-transform:uppercase}.copy{position:fixed;z-index:4;left:5vw;top:18vh;width:min(420px,42vw)}h1{font-size:clamp(60px,10vw,140px);line-height:.75;letter-spacing:-.075em;margin:0 0 30px}p{line-height:1.45}.control{position:fixed;z-index:6;left:5vw;bottom:7vh;width:min(420px,80vw)}input{width:100%}.label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}.scene{position:absolute;inset:0;perspective:1000px}.assembly{position:absolute;left:68%;top:48%;width:250px;height:420px;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(-12deg) rotateY(28deg)}.part{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transition:transform .1s linear}.profile{width:72px;height:350px;background:linear-gradient(90deg,#888,#eee 30%,#aaa 60%,#777);transform:translate(-50%,-50%);box-shadow:20px 20px 50px #777}.rail{width:28px;height:300px;background:#333;transform:translate(-50%,-50%) translateZ(38px)}.car{width:100px;height:65px;background:#eee;border:2px solid #333;transform:translate(-50%,-50%) translateZ(65px)}.plate{width:180px;height:150px;border:12px solid #555;transform:translate(-50%,-50%) translateZ(85px)}.call{position:absolute;font-size:10px;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}.c1{left:calc(68% + 120px);top:27%}.c2{left:calc(68% + 150px);top:47%}.c3{left:calc(68% + 120px);top:68%}@media(max-width:700px){.copy{top:12vh;width:70vw}.copy p{display:none}.assembly{left:55%;top:55%;transform:translate(-50%,-50%) scale(.75) rotateX(-12deg) rotateY(28deg)}.call{display:none}}</style></head><body><div class="top"><b>FORMIKAT</b><span>Product anatomy / prototype</span></div><div class="copy"><h1>Delta<br>Slide</h1><p>Das Produkt nicht nur fotografieren, sondern verständlich machen. Ein interaktiver Exploded View zeigt Konstruktionsprofil, Führung und Anbauteile als System.</p></div><div class="scene"><div class="assembly"><div class="part profile" id="a"></div><div class="part rail" id="b"></div><div class="part car" id="c"></div><div class="part plate" id="d"></div></div><span class="call c1">Rahmen / Anbau</span><span class="call c2">Linearführung</span><span class="call c3">Strangpressprofil</span></div><div class="control"><div class="label"><span>assembled</span><span>exploded</span></div><input id="range" type="range" min="0" max="100" value="0"></div><script>const r=document.querySelector('#range'),a=document.querySelector('#a'),b=document.querySelector('#b'),c=document.querySelector('#c'),d=document.querySelector('#d');function go(){let q=r.value/100;a.style.transform=`translate(-50%,-50%) translateX(${-80*q}px)`;b.style.transform=`translate(-50%,-50%) translateZ(${38+80*q}px)`;c.style.transform=`translate(-50%,-50%) translateZ(${65+180*q}px) translateY(${-50*q}px)`;d.style.transform=`translate(-50%,-50%) translateZ(${85+300*q}px) translateY(${80*q}px)`}r.oninput=go;go()</script></body></html>
