<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORMIKAT — DeltaSlide / Procedural Proof</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9d9d4;color:#111;font-family:Arial,Helvetica,sans-serif}canvas{display:block}.top{position:fixed;z-index:10;left:22px;right:22px;top:20px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.15em;text-transform:uppercase;pointer-events:none}.intro{position:fixed;z-index:10;left:4vw;top:15vh;width:min(390px,42vw);pointer-events:none}.intro h1{font-size:clamp(54px,8vw,120px);line-height:.78;letter-spacing:-.075em;margin:0 0 24px}.intro p{font-size:13px;line-height:1.45;max-width:330px}.panel{position:fixed;z-index:12;left:4vw;bottom:5vh;width:min(390px,88vw);background:rgba(217,217,212,.78);backdrop-filter:blur(8px);padding:14px 16px;border:1px solid rgba(0,0,0,.16)}.row{display:grid;grid-template-columns:92px 1fr 46px;gap:10px;align-items:center;margin:8px 0;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.row input{width:100%;accent-color:#111}.row output{text-align:right;font-variant-numeric:tabular-nums}.buttons{display:flex;gap:7px;margin-top:12px}.buttons button{border:1px solid #111;background:transparent;padding:8px 10px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.buttons button:hover,.buttons button.active{background:#111;color:#ddd}.status{position:fixed;z-index:10;right:22px;bottom:20px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;text-align:right;line-height:1.55;pointer-events:none}@media(max-width:720px){.intro{top:10vh;width:72vw}.intro p{display:none}.panel{left:4vw;bottom:3vh}.status{display:none}}
</style>
</head>
<body>
<div class="top"><b>FORMIKAT</b><span>DeltaSlide / procedural proof 01</span></div>
<div class="intro"><h1>Delta<br>Slide</h1><p>Kein CAD-Viewer. Das Modell wird aus Regeln erzeugt: drei Türme, drei Schlitten, sechs Arme und ein Effektor. Parameter verändern die Konstruktion live.</p></div>
<div class="panel">
  <div class="row"><label for="height">Höhe</label><input id="height" type="range" min="650" max="1100" value="860"><output id="heightO">860</output></div>
  <div class="row"><label for="radius">Radius</label><input id="radius" type="range" min="170" max="310" value="235"><output id="radiusO">235</output></div>
  <div class="row"><label for="carriage">Schlitten</label><input id="carriage" type="range" min="280" max="760" value="610"><output id="carriageO">610</output></div>
  <div class="row"><label for="explode">System</label><input id="explode" type="range" min="0" max="100" value="0"><output id="explodeO">0%</output></div>
  <div class="buttons"><button id="rules">Show rules</button><button id="motion">Motion</button><button id="reset">Reset</button></div>
</div>
<div class="status" id="status">3 towers<br>3 carriages<br>6 arms<br>1 effector</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const scene=new THREE.Scene(); scene.background=new THREE.Color(0xd9d9d4);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,1,5000); camera.position.set(760,560,920);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,380,0); controls.enableDamping=true; controls.minDistance=500; controls.maxDistance=1900;
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.2)); const key=new THREE.DirectionalLight(0xffffff,3); key.position.set(500,900,500); key.castShadow=true; scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),new THREE.MeshStandardMaterial({color:0xc9c9c4,roughness:1})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(1600,32,0x999999,0xbcbcb7); grid.position.y=.5; scene.add(grid);

const root=new THREE.Group(); scene.add(root); let rulesGroup=new THREE.Group(); scene.add(rulesGroup);
const mat={profile:new THREE.MeshStandardMaterial({color:0x777777,metalness:.65,roughness:.35}),rail:new THREE.MeshStandardMaterial({color:0x222222,metalness:.65,roughness:.3}),carriage:new THREE.MeshStandardMaterial({color:0xe8e8e3,metalness:.2,roughness:.45}),arm:new THREE.MeshStandardMaterial({color:0x333333,metalness:.55,roughness:.3}),effector:new THREE.MeshStandardMaterial({color:0xe8e8e3,metalness:.25,roughness:.4}),accent:new THREE.MeshStandardMaterial({color:0xff4a24,roughness:.45})};
function box(w,h,d,m){const x=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);x.castShadow=x.receiveShadow=true;return x}
function rod(a,b,r,m){const v=new THREE.Vector3().subVectors(b,a),mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5);const x=new THREE.Mesh(new THREE.CylinderGeometry(r,r,v.length(),10),m);x.position.copy(mid);x.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.clone().normalize());x.castShadow=true;return x}
function ring(radius,y){const pts=[];for(let i=0;i<3;i++){const a=i*Math.PI*2/3-Math.PI/2;pts.push(new THREE.Vector3(Math.cos(a)*radius,y,Math.sin(a)*radius))}for(let i=0;i<3;i++)rulesGroup.add(rod(pts[i],pts[(i+1)%3],2,mat.accent))}
const state={height:860,radius:235,carriage:610,explode:0,rules:false,motion:false};
function build(){while(root.children.length)root.remove(root.children[0]);while(rulesGroup.children.length)rulesGroup.remove(rulesGroup.children[0]);const H=state.height,R=state.radius,E=state.explode/100; const effY=Math.max(190,state.carriage-245); const effR=54;
  const basePts=[];
  for(let i=0;i<3;i++){const a=i*Math.PI*2/3-Math.PI/2;const dir=new THREE.Vector3(Math.cos(a),0,Math.sin(a));const tangent=new THREE.Vector3(-Math.sin(a),0,Math.cos(a));const towerPos=dir.clone().multiplyScalar(R*(1+.32*E));basePts.push(towerPos.clone());
    const tower=new THREE.Group(); tower.position.copy(towerPos); tower.rotation.y=-a; const p=box(42,H,42,mat.profile);p.position.y=H/2;tower.add(p);const rail=box(12,H-80,10,mat.rail);rail.position.set(0,H/2,27);tower.add(rail);const c=box(86,74,28,mat.carriage);c.position.set(0,state.carriage,44+90*E);tower.add(c);root.add(tower);
    for(const s of [-1,1]){const start=towerPos.clone().add(tangent.clone().multiplyScalar(s*31));start.y=state.carriage;const ea=a+s*.19;const end=new THREE.Vector3(Math.cos(ea)*effR,effY,Math.sin(ea)*effR);root.add(rod(start,end,5.5,mat.arm));}
  }
  for(let i=0;i<3;i++){const a=basePts[i],b=basePts[(i+1)%3];root.add(rod(new THREE.Vector3(a.x,20,a.z),new THREE.Vector3(b.x,20,b.z),15,mat.profile));root.add(rod(new THREE.Vector3(a.x,H-20,a.z),new THREE.Vector3(b.x,H-20,b.z),15,mat.profile));}
  const eff=new THREE.Mesh(new THREE.CylinderGeometry(effR,effR,18,6),mat.effector);eff.position.y=effY;eff.castShadow=true;root.add(eff);const nozzle=new THREE.Mesh(new THREE.ConeGeometry(9,30,16),mat.accent);nozzle.position.y=effY-23;nozzle.rotation.z=Math.PI;root.add(nozzle);
  const bed=new THREE.Mesh(new THREE.CylinderGeometry(R*.58,R*.58,12,48),new THREE.MeshStandardMaterial({color:0xb5b5b0,metalness:.15,roughness:.65}));bed.position.y=42;bed.receiveShadow=true;root.add(bed);
  if(state.rules){ring(R,20);ring(R,H-20);const axisMat=new THREE.LineBasicMaterial({color:0xff4a24});for(let i=0;i<3;i++){const p=basePts[i];const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p.x,0,p.z),new THREE.Vector3(p.x,H,p.z)]);rulesGroup.add(new THREE.Line(g,axisMat));}const env=new THREE.Mesh(new THREE.CylinderGeometry(R*.6,R*.6,H*.62,48,1,true),new THREE.MeshBasicMaterial({color:0xff4a24,wireframe:true,transparent:true,opacity:.13}));env.position.y=H*.31;rulesGroup.add(env);}
}
function bind(id,key,suffix=''){const e=document.getElementById(id),o=document.getElementById(id+'O');e.oninput=()=>{state[key]=+e.value;o.textContent=e.value+suffix;build()}}
bind('height','height');bind('radius','radius');bind('carriage','carriage');bind('explode','explode','%');
document.getElementById('rules').onclick=e=>{state.rules=!state.rules;e.currentTarget.classList.toggle('active',state.rules);build()};
document.getElementById('motion').onclick=e=>{state.motion=!state.motion;e.currentTarget.classList.toggle('active',state.motion)};
document.getElementById('reset').onclick=()=>{Object.assign(state,{height:860,radius:235,carriage:610,explode:0,rules:false,motion:false});for(const [id,v] of [['height',860],['radius',235],['carriage',610],['explode',0]]){document.getElementById(id).value=v;document.getElementById(id+'O').textContent=v+(id==='explode'?'%':'')}document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));build()};
build(); let t=0;function animate(){requestAnimationFrame(animate);t+=.012;if(state.motion){state.carriage=520+Math.sin(t)*125;document.getElementById('carriage').value=state.carriage;document.getElementById('carriageO').textContent=Math.round(state.carriage);build()}controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
