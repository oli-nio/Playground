<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORMIKAT — Journey Through Making</title><style>*{box-sizing:border-box}html,body{margin:0;background:#ecebe6;color:#111;font-family:Arial,Helvetica,sans-serif}body{height:600vh}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;inset:0;z-index:3;pointer-events:none;padding:18px}.brand{font-size:11px;font-weight:700;letter-spacing:.09em}.step{position:absolute;left:6vw;bottom:9vh;max-width:430px}.k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.step h1{font-size:clamp(34px,6vw,82px);line-height:.88;letter-spacing:-.06em;margin:0}.step p{font-size:13px;line-height:1.45;max-width:340px}.progress{position:fixed;top:0;left:0;height:3px;background:#111;z-index:5;transform-origin:left center}.hint{position:absolute;right:18px;bottom:18px;font-size:10px}.stage{transition:opacity .22s ease,transform .22s ease}.stage.swap{opacity:.15;transform:translateY(5px)}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#ecebe6;z-index:10;font-size:10px;letter-spacing:.12em;transition:opacity .4s}#loading.off{opacity:0;pointer-events:none}@media(max-width:700px){body{height:650vh}.ui{padding:13px}.step{left:16px;right:16px;bottom:8vh}.step h1{font-size:48px}.hint{display:none}}</style></head><body><div id="loading">FORMIKAT / MODELL LÄDT …</div><div class="progress"></div><div class="ui"><div class="brand">FORMIKAT / JOURNEY THROUGH MAKING<br>POC 01</div><div class="step"><div class="stage"><div class="k" id="k">01 / OBJEKT</div><h1 id="t">Ein Raum.</h1><p id="p">Die Ausstellung wird beim Scrollen schrittweise lesbar.</p></div></div><div class="hint">SCROLL ↓</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';const mobile=innerWidth<700,R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,mobile?1.15:1.6));R.setSize(innerWidth,innerHeight);R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;document.body.prepend(R.domElement);const S=new THREE.Scene();S.background=new THREE.Color(0xecebe6);const C=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,1000);S.add(new THREE.HemisphereLight(0xffffff,0x777777,1.7));const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(10,20,8);S.add(sun);const pm=new THREE.PMREMGenerator(R);S.environment=pm.fromScene(new RoomEnvironment(),.04).texture;pm.dispose();let root,center=new THREE.Vector3(),radius=10,targetQ=0,currentQ=0,lastText=-1;const homePos=new Map(),homeQuat=new Map();const A=[['01 / OBJEKT','Ein Raum.','Wir beginnen mit der realen Ausstellung — ruhig, lesbar und ohne Effekt um des Effekts willen.'],['02 / ANNÄHERUNG','Näher heran.','Scrollen führt die Kamera durch den Entwurf, statt einzelne Seiten auszutauschen.'],['03 / DETAIL','Konstruktion lesen.','Möbel, Objekte und räumliche Beziehungen werden selbst zum Inhalt.'],['04 / SYSTEM','Zusammenhänge sehen.','Der Entwurf lässt sich als zusammenhängendes räumliches System erzählen.'],['05 / FORMIKAT','Journey through making.','Eine Projektseite, die unsere reale Geometrie als Erzählraum benutzt.']];new GLTFLoader().load('./ortest2-web-q16.glb',g=>{root=g.scene;S.add(root);root.traverse(o=>{if(o.isMesh){homePos.set(o,o.position.clone());homeQuat.set(o,o.quaternion.clone());o.frustumCulled=false;const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if(m&&m.transparent&&m.opacity>.92){m.transparent=false;m.opacity=1;m.depthWrite=true;m.needsUpdate=true}})}});const b=new THREE.Box3().setFromObject(root),size=b.getSize(new THREE.Vector3());b.getCenter(center);radius=Math.max(size.x,size.y,size.z)*1.18;C.position.copy(center).add(new THREE.Vector3(.9,.58,1).normalize().multiplyScalar(radius));C.lookAt(center);document.getElementById('loading').classList.add('off')},undefined,()=>{document.getElementById('loading').textContent='MODELL KONNTE NICHT GELADEN WERDEN'});function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function ease(t){t=clamp(t,0,1);return t*t*(3-2*t)}function text(ix){if(ix===lastText)return;lastText=ix;const st=document.querySelector('.stage');st.classList.add('swap');setTimeout(()=>{const x=A[ix];document.getElementById('k').textContent=x[0];document.getElementById('t').textContent=x[1];document.getElementById('p').textContent=x[2];st.classList.remove('swap')},110)}function render(){const max=document.documentElement.scrollHeight-innerHeight;targetQ=max?scrollY/max:0;currentQ+=(targetQ-currentQ)*.075;const q=currentQ;document.querySelector('.progress').style.transform='scaleX('+q+')';text(Math.min(4,Math.floor(q*5)));if(root){const a=q*Math.PI*.48,zoom=1-ease((q-.62)/.38)*.28,rad=radius*zoom;const y=center.y+radius*(.34-.08*q);C.position.set(center.x+Math.cos(a)*rad*.72,y,center.z+Math.sin(a)*rad*.72);const look=center.clone();look.y+=radius*(.025-.035*q);C.lookAt(look)}R.render(S,C);requestAnimationFrame(render)}render();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.15:1.6));R.setSize(innerWidth,innerHeight)})</script></body></html>
