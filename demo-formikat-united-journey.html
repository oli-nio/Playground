<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORMIKAT — Journey Through Making</title><style>*{box-sizing:border-box}html,body{margin:0;background:#ecebe6;color:#111;font-family:Arial,Helvetica,sans-serif}body{height:620vh}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;inset:0;z-index:3;pointer-events:none;padding:18px}.brand{font-size:11px;font-weight:700;letter-spacing:.09em}.step{position:absolute;left:6vw;bottom:9vh;max-width:420px}.k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.step h1{font-size:clamp(34px,6vw,82px);line-height:.88;letter-spacing:-.06em;margin:0}.step p{font-size:13px;line-height:1.45;max-width:330px}.progress{position:fixed;top:0;left:0;height:3px;background:#111;z-index:5}.hint{position:absolute;right:18px;bottom:18px;font-size:10px}.stage{opacity:0;transform:translateY(15px);transition:.3s}.stage.on{opacity:1;transform:none}@media(max-width:700px){body{height:700vh}.ui{padding:13px}.step{left:16px;right:16px;bottom:8vh}.step h1{font-size:48px}.hint{display:none}}</style></head><body><div class="progress"></div><div class="ui"><div class="brand">FORMIKAT / JOURNEY THROUGH MAKING<br>UNITED CARRIERS PRINCIPLE — POC 01</div><div class="step"><div class="stage on"><div class="k" id="k">01 / ROHMATERIAL</div><h1 id="t">Ein Teil.</h1><p id="p">Nicht Projekte durchblättern. Beim Scrollen entsteht aus einzelnen Bauteilen ein Raum.</p></div></div><div class="hint">SCROLL ↓</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false});R.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.35:1.8));R.setSize(innerWidth,innerHeight);R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;document.body.prepend(R.domElement);const S=new THREE.Scene();S.background=new THREE.Color(0xecebe6);const C=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,500);S.add(new THREE.HemisphereLight(0xffffff,0x777777,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(8,15,10);S.add(sun);const pm=new THREE.PMREMGenerator(R);S.environment=pm.fromScene(new RoomEnvironment(),.04).texture;let root,parts=[],center=new THREE.Vector3(),baseCam=new THREE.Vector3();const tmp=new THREE.Vector3();new GLTFLoader().load('./ortest2-web-q16.glb',g=>{root=g.scene;S.add(root);const b=new THREE.Box3().setFromObject(root),sz=b.getSize(tmp),m=Math.max(sz.x,sz.y,sz.z);b.getCenter(center);root.traverse(o=>{if(o.isMesh){o.userData.home=o.position.clone();o.userData.seed=parts.length;parts.push(o)}});baseCam.copy(center).add(new THREE.Vector3(1,.58,1).normalize().multiplyScalar(m*1.15));C.position.copy(baseCam);C.lookAt(center)},undefined,()=>{document.getElementById('p').textContent='GLB konnte nicht geladen werden.'});const copy=new THREE.Vector3();function smooth(a,b,t){return a+(b-a)*(t*t*(3-2*t))}function update(){const max=document.documentElement.scrollHeight-innerHeight,q=max?scrollY/max:0;document.querySelector('.progress').style.width=(q*100)+'%';if(root){parts.forEach((o,i)=>{const h=o.userData.home,s=o.userData.seed;const threshold=Math.min(.62,(s%19)/19*.52);const a=Math.max(0,Math.min(1,(q-threshold)/.16));const ang=s*2.399,dist=(1-a)*(5+(s%11)*1.7);o.position.set(h.x+Math.cos(ang)*dist,h.y+(1-a)*((s%7)-3)*1.2,h.z+Math.sin(ang)*dist);o.rotation.y=(1-a)*((s%5)-2)*.35});const mobile=innerWidth<700;const orbit=q*Math.PI*.7;copy.copy(baseCam).sub(center);const rad=Math.hypot(copy.x,copy.z)*(mobile?1.18:1);C.position.set(center.x+Math.cos(orbit)*rad,baseCam.y+Math.sin(q*Math.PI)*2,center.z+Math.sin(orbit)*rad);if(q>.72){const z=smooth(1,.72,(q-.72)/.28);C.position.sub(center).multiplyScalar(z).add(center)}C.lookAt(center)}const ix=Math.min(4,Math.floor(q*5));if(ix!==window._ix){window._ix=ix;const A=[['01 / ROHMATERIAL','Ein Teil.','Wir beginnen nicht mit einer fertigen Projektseite, sondern mit dem Material unserer Arbeit.'],['02 / KONSTRUKTION','Es kommt zusammen.','Bauteile, Möbel und räumliche Systeme werden selbst zur Navigation.'],['03 / SYSTEM','Aus Teilen wird Struktur.','Die reale CAD-Geometrie erzählt den Entwurfs- und Herstellungsprozess.'],['04 / RAUM','Aus Struktur wird Ausstellung.','Scrollen ist nicht Seitenwechsel, sondern Aufbau.'],['05 / FORMIKAT','Journey through making.','Die Website zeigt nicht nur, was wir gemacht haben — sondern wie Dinge zu Räumen werden.']][ix];const st=document.querySelector('.stage');st.classList.remove('on');setTimeout(()=>{document.getElementById('k').textContent=A[0];document.getElementById('t').textContent=A[1];document.getElementById('p').textContent=A[2];st.classList.add('on')},100)}}function loop(){update();R.render(S,C);requestAnimationFrame(loop)}loop();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.35:1.8));R.setSize(innerWidth,innerHeight)})</script></body></html>
