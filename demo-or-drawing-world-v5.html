<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORMIKAT — Drawing World V5</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f0df}canvas{display:block;width:100%;height:100%;touch-action:none}.tag{position:fixed;z-index:3;left:15px;top:14px;color:#183b91;font:700 10px/1.45 Arial;letter-spacing:.11em;pointer-events:none}.tag strong{display:block;font-size:24px;letter-spacing:-.04em}.hint{position:fixed;z-index:3;right:14px;bottom:14px;color:#183b9188;font:10px Arial;pointer-events:none}</style></head><body><div class="tag">FORMIKAT · DRAWING WORLD V5<strong>RAUMSKIZZE</strong>Simple Bodies nur als unsichtbares Maßgerüst</div><div class="hint">ziehen · Raum drehen</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const R=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);R.outputColorSpace=THREE.SRGBColorSpace;R.setClearColor(0xf5f0df);document.body.prepend(R.domElement);const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,300),O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.enablePan=false;const G=new THREE.Group();S.add(G);const ink=new THREE.Color(0x173b91),dark=new THREE.Color(0x182d65);let seed=1947;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}function r(a,b){return a+(b-a)*rnd()}function stroke(a,b,opt={}){const passes=opt.passes||2,amp=opt.amp??.018,segments=opt.segments||14,col=opt.color||ink,opacity=opt.opacity??.72;for(let p=0;p<passes;p++){const pts=[];for(let i=0;i<=segments;i++){const t=i/segments,q=new THREE.Vector3().lerpVectors(a,b,t),fade=Math.sin(Math.PI*t);q.x+=r(-amp,amp)*fade;q.y+=r(-amp,amp)*fade;q.z+=r(-amp,amp)*fade;pts.push(q)}const m=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:opacity*r(.75,1)});G.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),m))}}function boxSketch(box,opt={}){const mn=box.min,mx=box.max,V=[new THREE.Vector3(mn.x,mn.y,mn.z),new THREE.Vector3(mx.x,mn.y,mn.z),new THREE.Vector3(mx.x,mn.y,mx.z),new THREE.Vector3(mn.x,mn.y,mx.z),new THREE.Vector3(mn.x,mx.y,mn.z),new THREE.Vector3(mx.x,mx.y,mn.z),new THREE.Vector3(mx.x,mx.y,mx.z),new THREE.Vector3(mn.x,mx.y,mx.z)],E=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];E.forEach((e,i)=>{if(opt.skip&&opt.skip.includes(i))return;let a=V[e[0]].clone(),b=V[e[1]].clone();const ext=opt.extend??.025,d=b.clone().sub(a).normalize();a.addScaledVector(d,-r(0,ext));b.addScaledVector(d,r(0,ext));stroke(a,b,{passes:opt.passes||2,amp:opt.amp??.014,opacity:opt.opacity??.64})})}function wash(box,color,opacity=.18,pad=.05){const sz=box.getSize(new THREE.Vector3()),ct=box.getCenter(new THREE.Vector3());const g=new THREE.PlaneGeometry(sz.x*(1+pad*r(.5,1.4)),sz.z*(1+pad*r(.5,1.4)));const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false});const q=new THREE.Mesh(g,m);q.rotation.x=-Math.PI/2;q.rotation.z=r(-.025,.025);q.position.set(ct.x+r(-.04,.04),box.min.y+.008,ct.z+r(-.04,.04));G.add(q)}function bbox(o){return new THREE.Box3().setFromObject(o)}function find(root,n){return root.getObjectByName(n)}function scribbleTree(box){const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());stroke(new THREE.Vector3(c.x,box.min.y,c.z),new THREE.Vector3(c.x+r(-.04,.04),box.min.y+s.y*.62,c.z+r(-.03,.03)),{passes:3,amp:.012});const top=new THREE.Vector3(c.x,box.min.y+s.y*.72,c.z);for(let k=0;k<11;k++){const a=r(0,Math.PI*2),rr=r(.08,Math.max(.1,s.x*.45));stroke(top.clone().add(new THREE.Vector3(Math.cos(a)*rr*.25,r(-.03,.04),Math.sin(a)*rr*.25)),top.clone().add(new THREE.Vector3(Math.cos(a)*rr,r(-.06,.08),Math.sin(a)*rr)),{passes:1,amp:.025,opacity:.5})}}function build(root){root.updateMatrixWorld(true);const room=['boden','wand_hinten','wand_links','wand_rechts'];room.forEach((n,i)=>{const o=find(root,n);if(o)boxSketch(bbox(o),{passes:i?2:3,amp:.022,opacity:i?.46:.55,skip:i?[0,2,4,6]:[]})});['saeule_0','saeule_1','saeule_2'].forEach(n=>{const o=find(root,n);if(o)boxSketch(bbox(o),{passes:2,amp:.012,opacity:.5,extend:.045})});const table=find(root,'schwamm_tisch');if(table){const b=bbox(table);wash(b,0x9ac9bc,.22,.18);boxSketch(b,{passes:3,amp:.022,opacity:.78,extend:.06})}['schwamm_haus1','schwamm_haus2','schwamm_haus3'].forEach((n,i)=>{const o=find(root,n);if(!o)return;const b=bbox(o);wash(b,[0xe7b7a5,0xe7cf82,0xa8c9d9][i],.26,.25);boxSketch(b,{passes:2,amp:.025,opacity:.72,extend:.07});const c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3());stroke(new THREE.Vector3(b.min.x-r(0,.03),b.max.y,c.z),new THREE.Vector3(c.x,b.max.y+s.y*r(.18,.35),c.z+r(-.02,.02)),{passes:2,amp:.018});stroke(new THREE.Vector3(c.x,b.max.y+s.y*r(.18,.35),c.z),new THREE.Vector3(b.max.x+r(0,.03),b.max.y,c.z+r(-.02,.02)),{passes:2,amp:.018})});const tr=find(root,'schwamm_baum1'),cr=find(root,'schwamm_krone');if(tr)scribbleTree(cr?bbox(cr):bbox(tr));const all=new THREE.Box3();room.forEach(n=>{const o=find(root,n);if(o)all.union(bbox(o))});const c=all.getCenter(new THREE.Vector3()),z=all.getSize(new THREE.Vector3()),m=Math.max(z.x,z.z);C.position.copy(c).add(new THREE.Vector3(m*.72,m*.58,m*.9));C.lookAt(c);O.target.copy(c);O.update()}new GLTFLoader().load('ortest2-simple-bodies-fixed.glb',g=>{g.scene.visible=false;S.add(g.scene);build(g.scene)},undefined,e=>console.error(e));function loop(){requestAnimationFrame(loop);O.update();R.render(S,C)}loop();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});</script></body></html>
