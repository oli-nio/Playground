<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORMIKAT — Drawing World V6</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f0df}canvas{display:block;width:100%;height:100%;touch-action:none}.tag{position:fixed;z-index:3;left:15px;top:14px;color:#183b91;font:700 10px/1.45 Arial;letter-spacing:.11em;pointer-events:none}.tag strong{display:block;font-size:24px;letter-spacing:-.04em}.hint{position:fixed;z-index:3;right:14px;bottom:14px;color:#183b9188;font:10px Arial;pointer-events:none}</style></head><body><div class="tag">FORMIKAT · DRAWING WORLD V6<strong>RAUMSKIZZE</strong>deckende Objekte · krakelige Zeichnung</div><div class="hint">ziehen · Raum drehen</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);R.outputColorSpace=THREE.SRGBColorSpace;R.setClearColor(0xf5f0df);document.body.prepend(R.domElement);const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,300),O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.enablePan=false;const F=new THREE.Group(),L=new THREE.Group();S.add(F,L);const ink=new THREE.Color(0x173b91);let seed=1947;function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}function r(a,b){return a+(b-a)*rnd()}function bbox(o){return new THREE.Box3().setFromObject(o)}function find(root,n){return root.getObjectByName(n)}function stroke(a,b,opt={}){for(let p=0;p<(opt.passes||2);p++){const pts=[],N=opt.segments||15,A=opt.amp??.018;for(let i=0;i<=N;i++){let t=i/N,q=new THREE.Vector3().lerpVectors(a,b,t),f=Math.sin(Math.PI*t);q.x+=r(-A,A)*f;q.y+=r(-A,A)*f;q.z+=r(-A,A)*f;pts.push(q)}L.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:opt.color||ink,transparent:true,opacity:(opt.opacity??.78)*r(.76,1),depthTest:true,depthWrite:false}))}}function boxSketch(b,opt={}){const n=b.min,x=b.max,V=[new THREE.Vector3(n.x,n.y,n.z),new THREE.Vector3(x.x,n.y,n.z),new THREE.Vector3(x.x,n.y,x.z),new THREE.Vector3(n.x,n.y,x.z),new THREE.Vector3(n.x,x.y,n.z),new THREE.Vector3(x.x,x.y,n.z),new THREE.Vector3(x.x,x.y,x.z),new THREE.Vector3(n.x,x.y,x.z)],E=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];E.forEach((e,i)=>{if(opt.skip?.includes(i))return;let a=V[e[0]].clone(),z=V[e[1]].clone(),d=z.clone().sub(a).normalize(),ex=opt.extend??.025;a.addScaledVector(d,-r(0,ex));z.addScaledVector(d,r(0,ex));stroke(a,z,opt)})}function solidBox(b,color,rough=.02){const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),q=new THREE.Mesh(new THREE.BoxGeometry(s.x,s.y,s.z),new THREE.MeshBasicMaterial({color,polygonOffset:true,polygonOffsetFactor:2,polygonOffsetUnits:2}));q.position.copy(c).add(new THREE.Vector3(r(-rough,rough),0,r(-rough,rough)));q.rotation.y=r(-.01,.01);F.add(q)}function solidCylinder(b,color){const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),rad=Math.max(s.x,s.z)*.5,q=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,s.y,12),new THREE.MeshBasicMaterial({color}));q.position.copy(c);F.add(q)}function floorFill(b){const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),q=new THREE.Mesh(new THREE.BoxGeometry(s.x,.018,s.z),new THREE.MeshBasicMaterial({color:0xd9e0d7}));q.position.set(c.x,b.min.y-.012,c.z);F.add(q)}function tree(tb,cb){const b=bbox(tb);solidCylinder(b,0xa9855f);boxSketch(b,{passes:2,amp:.015 dd(new THREE.Vector3(m*.72,m*.58,m*.9));C.lookAt(c);O.target.copy(c);O.update()}new GLTFLoader().load('ortest2-simple-bodies-fixed.glb',g=>{S.add(g.scene);g.scene.updateMatrixWorld(true);build(g.scene);g.scene.traverse(o=>{if(o.isMesh)o.visible=false})},undefined,e=>{console.error(e);document.querySelector('.hint').textContent='GLB FEHLER: '+e.message});function loop(){requestAnimationFrame(loop);O.update();R.render(S,C)}loop();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});</script></body></html>
