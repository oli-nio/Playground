<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORMIKAT Drawing World V7</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f0df}canvas{display:block;touch-action:none}.tag{position:fixed;z-index:2;left:15px;top:14px;color:#173b91;font:700 10px Arial;letter-spacing:.1em;pointer-events:none}.tag b{display:block;font-size:24px;letter-spacing:-.04em;margin-top:3px}.hint{position:fixed;right:14px;bottom:14px;color:#173b9180;font:10px Arial}</style></head><body><div class="tag">FORMIKAT · DRAWING WORLD V7<b>RAUMSKIZZE</b>deckend + krakelig</div><div class="hint">ziehen · Raum drehen</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const r=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.setClearColor(0xf5f0df);document.body.prepend(r.domElement);const s=new T.Scene(),c=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,150),o=new OrbitControls(c,r.domElement);o.enableDamping=true;o.enablePan=false;o.minDistance=7;o.maxDistance=40;const fill=new T.Group(),line=new T.Group();s.add(fill,line);let seed=421;const R=(a,b)=>(seed=seed*16807%2147483647,a+(b-a)*(seed-1)/2147483646),ink=0x173b91;function box(cx,cy,cz,sx,sy,sz,col,outline=true){const m=new T.Mesh(new T.BoxGeometry(sx,sy,sz),new T.MeshBasicMaterial({color:col,polygonOffset:true,polygonOffsetFactor:2,polygonOffsetUnits:2}));m.position.set(cx,cy,cz);fill.add(m);if(outline)edges(cx,cy,cz,sx,sy,sz)}function stroke(a,b,passes=2,amp=.018,op=.82){for(let p=0;p<passes;p++){const q=[];for(let i=0;i<=15;i++){const t=i/15,v=new T.Vector3().lerpVectors(a,b,t),s=Math.sin(Math.PI*t);v.x+=R(-amp,amp)*s;v.y+=R(-amp,amp)*s;v.z+=R(-amp,amp)*s;q.push(v)}line.add(new T.Line(new T.BufferGeometry().setFromPoints(q),new T.LineBasicMaterial({color:ink,transparent:true,opacity:op*R(.75,1),depthTest:true,depthWrite:false})))}}function edges(cx,cy,cz,sx,sy,sz){const x=sx/2,y=sy/2,z=sz/2,V=[[-x,-y,-z],[x,-y,-z],[x,-y,z],[-x,-y,z],[-x,y,-z],[x,y,-z],[x,y,z],[-x,y,z]].map(v=>new T.Vector3(cx+v[0],cy+v[1],cz+v[2])),E=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];E.forEach(e=>{let a=V[e[0]].clone(),b=V[e[1]].clone(),d=b.clone().sub(a).normalize();a.addScaledVector(d,-R(.01,.06));b.addScaledVector(d,R(.01,.06));stroke(a,b,2,.022,.8)})}function column(x,z){const m=new T.Mesh(new T.CylinderGeometry(.22,.22,5.2,12),new T.MeshBasicMaterial({color:0xe5e1d4,polygonOffset:true,polygonOffsetFactor:2,polygonOffsetUnits:2}));m.position.set(x,2.6,z);fill.add(m);for(let i=0;i<4;i++){const a=i*Math.PI/2,dx=Math.cos(a)*.22,dz=Math.sin(a)*.22;stroke(new T.Vector3(x+dx,0,z+dz),new T.Vector3(x+dx,5.2,z+dz),2,.014,.65)}}// open room: solid floor/back wall only, side walls are sketch gestures
box(31.6322,-.02,-27.811,13.2214,.08,12.482,0xd8dfd8,true);box(31.6322,2.4,-33.972,13.2214,4.8,.12,0xeee4cf,true);stroke(new T.Vector3(25.1,0,-34),new T.Vector3(25.1,0,-21.57),3,.028,.55);stroke(new T.Vector3(25.1,0,-34),new T.Vector3(25.1,4.8,-34),3,.025,.55);stroke(new T.Vector3(38.16,0,-34),new T.Vector3(38.16,0,-21.57),3,.028,.55);column(28.2,-24.4);column(32.4,-24.4);column(35.6,-24.4);// Schwammstadt solid pastel objects
box(29.435,.55,-33.021,2.4,1.1,1.6,0xc8b58f);box(28.885,1.38,-33.25,.55,.65,.5,0xe6b3a1);box(29.435,1.5,-32.88,.58,.78,.55,0xe3cf83);box(29.94,1.4,-33.18,.52,.62,.48,0xa8c9d8);// roof scribbles
[[28.885,1.705,-33.25,.55],[29.435,1.89,-32.88,.58],[29.94,1.71,-33.18,.52]].forEach(v=>{const[x,y,z,w]=v,A=new T.Vector3(x-w/2,y,z),B=new T.Vector3(x,y+.22,z),C=new T.Vector3(x+w/2,y,z);stroke(A,B,2,.018,.85);stroke(B,C,2,.018,.85)});// tree
const trunk=new T.Mesh(new T.CylinderGeometry(.07,.09,1.25,8),new T.MeshBasicMaterial({color:0xa7835e}));trunk.position.set(30.15,1.55,-32.57);fill.add(trunk);const crown=new T.Mesh(new T.IcosahedronGeometry(.48,1),new T.MeshBasicMaterial({color:0x9cbd86,polygonOffset:true,polygonOffsetFactor:2,polygonOffsetUnits:2}));crown.scale.set(1,.8,1);crown.position.set(30.15,2.3,-32.57);fill.add(crown);for(let i=0;i<18;i++){const a=R(0,Math.PI*2),u=R(-.7,.7),rr=.48*Math.sqrt(1-u*u);stroke(new T.Vector3(30.15+Math.cos(a)*rr*.2,2.3+u*.15,-32.57+Math.sin(a)*rr*.2),new T.Vector3(30.15+Math.cos(a)*rr,2.3+u*.38,-32.57+Math.sin(a)*rr),1,.025,.55)}// additional solid landmarks so model is unmistakable

for(let i=0;i<5;i++)box(27.98+i*.32,.35+i*.13,-29.612,.22,.7+i*.26,.32,i%2?0x9dbed2:0xd99e96);c.position.set(40.7,9.3,-17.0);o.target.set(31.4,1.4,-28.4);c.lookAt(o.target);o.update();function loop(){requestAnimationFrame(loop);o.update();r.render(s,c)}loop();addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});</script></body></html>
