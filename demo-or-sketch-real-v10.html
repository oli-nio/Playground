<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORMIKAT — Skizze / Real</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f0df;font-family:Arial;color:#173b91}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.head{position:fixed;z-index:10;left:15px;top:14px;pointer-events:none;font:700 10px/1.35 Arial;letter-spacing:.1em}.head b{display:block;font-size:25px;letter-spacing:-.045em}.hint{position:fixed;z-index:10;right:14px;bottom:86px;font:10px Arial;color:#173b9180;pointer-events:none}.bar{position:fixed;z-index:12;left:50%;bottom:14px;transform:translateX(-50%);width:min(720px,calc(100vw - 24px));padding:10px 14px 8px;background:#fffdf0e8;border:1px solid #173b9133;border-radius:17px;backdrop-filter:blur(10px)}input{width:100%;appearance:none;background:transparent;height:18px}input::-webkit-slider-runnable-track{height:2px;background:#173b91}input::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:#173b91;border:3px solid white;margin-top:-6px}.labels{display:flex;justify-content:space-between;font:700 8px Arial;letter-spacing:.1em;text-transform:uppercase}@media(max-width:700px){.head b{font-size:20px}.hint{display:none}}</style></head><body><iframe id="world" src="demo-or-process-morph-v9.html"></iframe><div class="head">FORMIKAT · SONNE. SATT.<b id="state">SKIZZE</b><span id="sub">Idee / räumliche Entwurfszeichnung</span></div><div class="hint">ziehen · Raum drehen<br>Fader · Skizze → Real</div><div class="bar"><input id="fade" type="range" min="0" max="1000" value="0"><div class="labels"><span>Skizze</span><span>Real</span></div></div><script>const frame=document.getElementById('world'),fade=document.getElementById('fade'),state=document.getElementById('state'),sub=document.getElementById('sub');let innerRange=null;function clean(){try{const d=frame.contentDocument;if(!d)return;const old=d.querySelector('.bar');if(old)old.style.display='none';const h=d.getElementById('head');if(h)h.style.display='none';const hint=d.querySelector('.hint');if(hint)hint.style.display='none';innerRange=d.getElementById('range');sync()}catch(e){}}function sync(){if(!innerRange)return;innerRange.value=fade.value;innerRange.dispatchEvent(new Event('input',{bubbles:true}));const p=fade.value/1000;if(p<.5){state.textContent='SKIZZE';sub.textContent='Idee / räumliche Entwurfszeichnung'}else{state.textContent='REAL';sub.textContent='Entwurf wird gebautes Ergebnis'}}frame.addEventListener('load',()=>{clean();setTimeout(clean,250);setTimeout(clean,1000)});fade.addEventListener('input',sync);addEventListener('wheel',e=>{if(e.target===fade)return;fade.value=Math.max(0,Math.min(1000,+fade.value+Math.sign(e.deltaY)*28));sync()},{passive:true});</script></body></html>
