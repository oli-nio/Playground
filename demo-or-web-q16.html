<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>FORMIKAT OR — Web Q16 Baseline</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ecebe7;color:#111;font-family:Arial,Helvetica,sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;padding:18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .brand{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.35}
  .status{font-size:11px;line-height:1.4;text-align:right;max-width:46ch;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);padding:8px 10px;border-radius:999px}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;font-size:11px;line-height:1.4}
  .hint{background:rgba(255,255,255,.72);backdrop-filter:blur(10px);padding:8px 10px;border-radius:999px}
  .stats{text-align:right;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);padding:8px 10px;border-radius:12px}
  #bar{position:fixed;left:0;top:0;height:2px;width:0;background:#111;transition:width .15s ease}
  #error{position:fixed;left:18px;right:18px;top:60px;background:#fff;padding:14px;border:1px solid #111;display:none;white-space:pre-wrap;font:12px/1.45 monospace;z-index:5}
</style>
</head>
<body>
<div id="bar"></div>
<div id="error"></div>
<div id="ui">
  <div class="top">
    <div class="brand">FORMIKAT<br>OR / WEB BASELINE<br>Q16</div>
    <div class="status" id="status">Lade ortest2-web-q16.glb …</div>
  </div>
  <div class="bottom">
    <div class="hint">Drag = Orbit · Wheel/Pinch = Zoom · Right drag = Pan</div>
    <div class="stats" id="stats"></div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xecebe7);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.01, 500);
camera.position.set(14,10,16);
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.screenSpacePanning = true;
controls.minDistance = 0.2;
controls.maxDistance = 120;

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,1.2));
const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(10,20,8);
scene.add(sun);

const status = document.getElementById('status');
const stats = document.getElementById('stats');
const bar = document.getElementById('bar');
const error = document.getElementById('error');

function frameObject(root){
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x,size.y,size.z);
  const fov = camera.fov * Math.PI/180;
  let distance = maxDim / (2*Math.tan(fov/2));
  distance *= 1.25;
  const dir = new THREE.Vector3(1,0.72,1).normalize();
  camera.position.copy(center).add(dir.multiplyScalar(distance));
  camera.near = Math.max(0.01, distance/1000);
  camera.far = distance*20;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

const loader = new GLTFLoader();
const t0 = performance.now();
loader.load('ortest2-web-q16.glb', gltf => {
  scene.add(gltf.scene);
  frameObject(gltf.scene);
  let meshes=0, tris=0;
  gltf.scene.traverse(o=>{
    if(o.isMesh){
      meshes++;
      const g=o.geometry;
      tris += g.index ? g.index.count/3 : (g.attributes.position?.count||0)/3;
      if(Array.isArray(o.material)) o.material.forEach(m=>m.needsUpdate=true);
      else if(o.material) o.material.needsUpdate=true;
    }
  });
  const sec=((performance.now()-t0)/1000).toFixed(2);
  status.textContent = `Bereit · ${sec}s`;
  stats.innerHTML = `${meshes.toLocaleString('de-DE')} Meshes<br>${Math.round(tris).toLocaleString('de-DE')} Triangles<br>24.66 MiB GLB`;
  bar.style.width='100%';
  setTimeout(()=>bar.style.opacity='0',350);
}, xhr => {
  if(xhr.total){
    const p=Math.min(100,xhr.loaded/xhr.total*100);
    bar.style.width=p+'%';
    status.textContent=`Lade ${p.toFixed(0)} %`;
  }
}, e => {
  console.error(e);
  status.textContent='Fehler beim Laden';
  error.style.display='block';
  error.textContent=String(e?.message||e)+'\n\nHinweis: HTML und GLB über einen Webserver ausliefern, nicht direkt per file:// öffnen.';
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
