<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>FORMIKAT — Schichtwäsche</title>
<meta name="theme-color" content="#121111" />
<style>
:root{--bg:#11100f;--ink:#f2eee8;--pink:#d48f98;--dust:#a7ad92;--line:rgba(242,238,232,.18)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{touch-action:none}.app{height:100%;position:relative;isolation:isolate;background:radial-gradient(circle at 50% 40%,#2e2924 0,#171411 38%,#0d0c0b 75%)}.grain{position:absolute;inset:0;pointer-events:none;opacity:.13;z-index:30;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}.top{position:absolute;left:clamp(16px,3vw,38px);right:clamp(16px,3vw,38px);top:clamp(16px,3vw,30px);z-index:20;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font-weight:800;font-size:clamp(18px,2.2vw,30px);letter-spacing:-.06em}.meta{text-align:right;text-transform:uppercase;letter-spacing:.12em;font-size:10px;line-height:1.55;opacity:.72}.stage{position:absolute;inset:0;display:grid;place-items:center;perspective:1100px}.machine{position:relative;width:min(72vw,72vh,710px);aspect-ratio:1;border-radius:50%;transform-style:preserve-3d;filter:drop-shadow(0 28px 38px rgba(0,0,0,.55));animation:float 7s ease-in-out infinite}.machine:before{content:"";position:absolute;inset:-9%;border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 0 0 10px rgba(255,255,255,.018),0 0 0 1px rgba(0,0,0,.9);background:conic-gradient(from 15deg,#504944,#25211e 8%,#6c635b 18%,#25211e 31%,#4d4640 44%,#211e1b 55%,#6a625a 71%,#282421 83%,#4c4540);z-index:-2}.machine:after{content:"SCHICHT  /  SCHICHT  /  SCHICHT  /  SCHICHT";position:absolute;inset:-13%;border:1px dashed rgba(242,238,232,.22);border-radius:50%;display:grid;place-items:start center;padding-top:3%;font-size:9px;letter-spacing:.22em;opacity:.65;animation:spin 34s linear infinite;z-index:-3}.drum{position:absolute;inset:7%;border-radius:50%;overflow:hidden;background:#060606;box-shadow:inset 0 0 0 2px #0a0908,inset 0 0 0 12px #3b3530,inset 0 0 55px 25px rgba(0,0,0,.65);cursor:grab}.drum:active{cursor:grabbing}.layer{position:absolute;inset:0;background-position:center;background-size:cover;transform:scale(1.035);transition:filter .35s}.layer.base{background-image:linear-gradient(rgba(22,18,17,.12),rgba(22,18,17,.1)),url('https://formikat.de/wp-content/uploads/2020/10/20201012_formikat_Frankesche_Stiftung-280_bmz.jpg')}.layer.reveal{background-image:url('https://formikat.de/wp-content/uploads/2020/10/20201012_formikat_Frankesche_Stiftung-36_bmz.jpg');clip-path:circle(var(--r,0px) at var(--x,50%) var(--y,50%));filter:saturate(.86) contrast(1.05)}.layer.third{background-image:url('https://formikat.de/wp-content/uploads/2020/10/20201012_formikat_Frankesche_Stiftung-143.jpg');opacity:var(--third,0);mix-blend-mode:screen;filter:contrast(1.1) saturate(.8);transition:opacity .8s}.drum:before{content:"";position:absolute;inset:0;z-index:6;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 36% 26%,rgba(255,255,255,.26),transparent 15%),radial-gradient(circle at 50% 56%,transparent 45%,rgba(0,0,0,.42) 67%,rgba(0,0,0,.82) 84%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 0 70px rgba(0,0,0,.7)}.strata{position:absolute;inset:8%;z-index:7;border-radius:50%;pointer-events:none;opacity:.34;background:repeating-radial-gradient(ellipse at 51% 72%,transparent 0 21px,rgba(227,181,172,.35) 22px,transparent 24px 37px);mix-blend-mode:screen;transform:rotate(-8deg)}.rock{position:absolute;z-index:10;width:54px;height:48px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:55% 42% 60% 36%;background:linear-gradient(135deg,#d8b4aa,#8e7771 58%,#5e504d);box-shadow:0 8px 18px rgba(0,0,0,.45);pointer-events:none;opacity:.95;transition:.7s cubic-bezier(.22,.9,.3,1)}.rock.clean{transform:translate(-50%,-50%) rotate(720deg) scale(.18);opacity:0}.hint{position:absolute;left:50%;bottom:clamp(28px,5.3vh,56px);transform:translateX(-50%);z-index:20;text-align:center;white-space:nowrap}.hint strong{display:block;font-size:clamp(20px,3vw,42px);letter-spacing:-.05em;font-weight:600}.hint span{display:block;margin-top:7px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.58}.progress{position:absolute;left:clamp(16px,3vw,38px);bottom:clamp(18px,3vw,30px);z-index:20;width:min(240px,42vw)}.phead{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.68;margin-bottom:8px}.track{height:2px;background:rgba(255,255,255,.14);overflow:hidden}.fill{height:100%;width:0;background:var(--ink);transition:width .1s linear}.side{position:absolute;right:clamp(16px,3vw,38px);bottom:clamp(18px,3vw,30px);z-index:20;text-align:right;max-width:250px}.side .title{font-size:12px;font-weight:700}.side .copy{font-size:10px;line-height:1.4;opacity:.55;margin-top:4px}.stamp{position:absolute;left:50%;top:50%;z-index:12;transform:translate(-50%,-50%) scale(.8) rotate(-7deg);border:2px solid rgba(242,238,232,.75);border-radius:2px;padding:11px 14px;text-transform:uppercase;font-weight:800;letter-spacing:.12em;font-size:clamp(16px,2.2vw,28px);opacity:0;pointer-events:none;transition:.45s}.stamp.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-7deg)}.bubbles{position:absolute;inset:-18%;z-index:-1;pointer-events:none}.bubble{position:absolute;border:1px solid rgba(237,228,218,.2);border-radius:50%;animation:bob var(--d) ease-in-out infinite alternate}.bubble:nth-child(1){width:42px;height:42px;left:12%;top:28%;--d:3.2s}.bubble:nth-child(2){width:18px;height:18px;right:14%;top:15%;--d:2.2s}.bubble:nth-child(3){width:72px;height:72px;right:5%;bottom:20%;--d:4.2s}.bubble:nth-child(4){width:28px;height:28px;left:18%;bottom:8%;--d:3.8s}@keyframes float{50%{transform:translateY(-8px) rotateX(1deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{to{transform:translateY(-13px) scale(1.08)}}
@media(max-width:650px){.machine{width:min(88vw,66vh)}.meta{display:none}.side{display:none}.hint{bottom:88px}.hint strong{font-size:23px}.progress{width:calc(100vw - 32px)}.machine:after{font-size:7px}.rock{width:42px;height:38px}}
@media(prefers-reduced-motion:reduce){.machine,.machine:after,.bubble{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><div class="brand">FORMIKAT</div><div class="meta">EXPERIMENT 06<br>IM STEINBRUCH DER ZEIT<br>FRANCKESCHE STIFTUNGEN · 2020</div></div>
  <main class="stage">
    <div class="machine" id="machine">
      <div class="bubbles"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div>
      <div class="drum" id="drum" aria-label="Interaktive Ausstellungsschichten">
        <div class="layer base"></div>
        <div class="layer reveal" id="reveal"></div>
        <div class="layer third" id="third"></div>
        <div class="strata"></div>
        <div class="rock" id="rock"></div>
        <div class="stamp" id="stamp">Schicht freigelegt</div>
      </div>
    </div>
  </main>
  <div class="hint" id="hint"><strong>Reibe den Stein frei.</strong><span>ziehen · kreisen · schichten entdecken</span></div>
  <div class="progress"><div class="phead"><span>Freilegung</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></div>
  <div class="side"><div class="title">Im Steinbruch der Zeit</div><div class="copy">Eine Ausstellung, die Geschichte Schicht für Schicht erzählt. Hier wird das Portfolio selbst zur Ausgrabung.</div></div>
  <div class="grain"></div>
</div>
<script>
(()=>{const drum=document.getElementById('drum'),reveal=document.getElementById('reveal'),third=document.getElementById('third'),fill=document.getElementById('fill'),percent=document.getElementById('percent'),rock=document.getElementById('rock'),stamp=document.getElementById('stamp'),hint=document.getElementById('hint'),machine=document.getElementById('machine');let active=false,score=0,last=null,done=false;
function pos(e){const r=drum.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:Math.max(0,Math.min(r.width,p.clientX-r.left)),y:Math.max(0,Math.min(r.height,p.clientY-r.top)),w:r.width}}
function update(e){if(!active||done)return;const p=pos(e);if(last){const d=Math.hypot(p.x-last.x,p.y-last.y);score=Math.min(100,score+d/(p.w*0.042));}last=p;const radius=Math.max(18,p.w*(.045+score/112));reveal.style.setProperty('--x',p.x+'px');reveal.style.setProperty('--y',p.y+'px');reveal.style.setProperty('--r',radius+'px');fill.style.width=score+'%';percent.textContent=Math.round(score)+'%';machine.style.transform=`rotateX(${(p.y/p.w-.5)*4}deg) rotateY(${(p.x/p.w-.5)*-5}deg)`;if(score>72)third.style.setProperty('--third',Math.min(.42,(score-72)/65));if(score>=99){done=true;reveal.style.setProperty('--x','50%');reveal.style.setProperty('--y','50%');reveal.style.setProperty('--r','100%');third.style.setProperty('--third','.28');rock.classList.add('clean');stamp.classList.add('show');hint.innerHTML='<strong>Die Oberfläche war nur der Anfang.</strong><span>tippen, um neu zu schichten</span>';setTimeout(()=>stamp.classList.remove('show'),1700)}}
function start(e){active=true;last=pos(e);if(done){done=false;score=0;reveal.style.setProperty('--r','0px');third.style.setProperty('--third','0');fill.style.width='0';percent.textContent='0%';rock.classList.remove('clean');hint.innerHTML='<strong>Reibe den Stein frei.</strong><span>ziehen · kreisen · schichten entdecken</span>'}e.preventDefault()}
function end(){active=false;last=null;machine.style.transform=''}
drum.addEventListener('pointerdown',start);window.addEventListener('pointermove',update);window.addEventListener('pointerup',end);drum.addEventListener('touchstart',start,{passive:false});window.addEventListener('touchmove',update,{passive:false});window.addEventListener('touchend',end);})();
</script>
</body>
</html>
