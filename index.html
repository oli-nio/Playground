<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FORMIKAT OS — Erfahrung wird Vorsprung</title>
  <style>
    html,body{margin:0;background:#101722;color:#f5f2eb;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .loading small{display:block;color:#adb8c7;margin-top:8px}
  </style>
</head>
<body>
  <div class="loading">
    <div>FORMIKAT OS wird geladen …<small>Die Präsentation wird aus der bestehenden Datei geladen.</small></div>
  </div>

  <script>
  (function () {
    var PATCH = [
      '/* iOS / mobile viewport overflow fix */',
      'html,body{overflow-x:hidden!important;max-width:100%!important;width:100%!important;}',
      'body{position:relative;}',
      'main,header,footer,section,.wrap{max-width:100%!important;min-width:0!important;}',
      '.hero>*,.sh>*,.source-layout>*,.potential>*,.finance>*,.infra>*,.phase-detail>*,.contrast>*,.identity-grid>*,.pilot-grid>*,.no-grid>*{min-width:0!important;}',
      '.rail,.offer-scroll{max-width:100%!important;}',
      'img,svg,video,canvas{max-width:100%;}',
      '@supports (overflow:clip){html,body{overflow-x:clip!important;}}'
    ].join('');

    fetch('./formikat-astra-pitch.html?overflowfix=1', {cache:'no-store'})
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (source) {
        if (source.indexOf('</style>') !== -1) {
          source = source.replace('</style>', PATCH + '</style>');
        } else {
          source = source.replace('</head>', '<style>' + PATCH + '</style></head>');
        }

        /* Keep the original document intact; only add the viewport fix. */
        document.open();
        document.write(source);
        document.close();
      })
      .catch(function (err) {
        document.body.innerHTML =
          '<div class="loading"><div>Die Präsentation konnte nicht geladen werden.' +
          '<small>Bitte prüfen, ob <b>formikat-astra-pitch.html</b> im selben GitHub-Ordner liegt.</small></div></div>';
        console.error(err);
      });
  })();
  </script>
</body>
</html>
