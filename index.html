<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FORMIKAT OS — Erfahrung wird Vorsprung</title>
  <style>
    html,body{margin:0;background:#101722;color:#f5f2eb;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .loading small{display:block;color:#adb8c7;margin-top:8px}
  </style>
</head>
<body>
  <div class="loading">
    <div>FORMIKAT OS wird geladen …<small>Die Präsentation wird aus der bestehenden Datei geladen.</small></div>
  </div>

  <script>
  (function () {
    var PATCH = [
      '/* iOS / mobile viewport overflow fix */',
      'html,body{overflow-x:hidden!important;max-width:100%!important;width:100%!important;}',
      'body{position:relative;}',
      'main,header,footer,section,.wrap{max-width:100%!important;min-width:0!important;}',
      '.hero>*,.sh>*,.source-layout>*,.potential>*,.finance>*,.infra>*,.phase-detail>*,.contrast>*,.identity-grid>*,.pilot-grid>*,.no-grid>*{min-width:0!important;}',
      '.rail,.offer-scroll{max-width:100%!important;}',
      'img,svg,video,canvas{max-width:100%;}',
      '@supports (overflow:clip){html,body{overflow-x:clip!important;}}',
      '/* insight bridge images */',
      '.insight-bridge{padding:18px 0 54px;border-top:1px solid var(--l,#344151);background:var(--bg,#101722);}',
      '.insight-bridge .insight-wrap{width:min(1320px,calc(100% - 32px));margin:auto;}',
      '.insight-bridge figure{margin:0;}',
      '.insight-bridge img{display:block;width:100%;height:auto;border-radius:20px;border:1px solid rgba(255,255,255,.07);box-shadow:0 22px 70px rgba(0,0,0,.24);}',
      '@media(max-width:620px){.insight-bridge{padding:10px 0 34px}.insight-bridge .insight-wrap{width:calc(100% - 18px)}.insight-bridge img{border-radius:13px}}'
    ].join('');

    fetch('./formikat-astra-pitch.html?overflowfix=1', {cache:'no-store'})
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (source) {
        if (source.indexOf('</style>') !== -1) {
          source = source.replace('</style>', PATCH + '</style>');
        } else {
          source = source.replace('</head>', '<style>' + PATCH + '</style></head>');
        }

        /* First reversible bridge: after the opening problem section. */
        var bridge = '<div class="insight-bridge" aria-label="Visuelle Erkenntnis: Workflow-Engine"><div class="insight-wrap"><figure><img src="./assets/insights/workflow-engine.webp" width="1536" height="1024" loading="lazy" decoding="async" alt="Die eigentliche Workflow-Engine ist heute die enge Kopplung zwischen Oliver und Matthias. Das Diagramm zeigt den bidirektionalen Austausch von Ideen, Entscheidungen, Dateien, Feedback und Organisation sowie die gemessenen Reaktionszeiten."></figure></div></div>';
        source = source.replace('</section><div class="breaker">', '</section>' + bridge + '<div class="breaker">');

        document.open();
        document.write(source);
        document.close();
      })
      .catch(function (err) {
        document.body.innerHTML =
          '<div class="loading"><div>Die Präsentation konnte nicht geladen werden.' +
          '<small>Bitte prüfen, ob <b>formikat-astra-pitch.html</b> im selben GitHub-Ordner liegt.</small></div></div>';
        console.error(err);
      });
  })();
  </script>
</body>
</html>
