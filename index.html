3>3 · KI-Rechner + zentraler Speicher</h3><p>Zur Compute-Workstation kommt zentraler, gesicherter Speicher. Rechnen und Unternehmensgedächtnis erhalten getrennte Rollen.</p><div class=\"cap-grid\"><div class=\"cap\"><b>Workstation</b>8.725,00 €</div><div class=\"cap\"><b>Synology DS923+</b>545,38 €</div><div class=\"cap\"><b>4 × WD Red Pro</b>1.320,00 €</div><div class=\"cap\"><b>Systemkern</b>10.590,38 € netto</div></div><div class=\"offer\"><strong>Beispiel MIFCOM · Compute + zentraler Speicher</strong><div class=\"offer-scroll\"><table class=\"offer-table\"><tr><th>Baustein</th><th>netto</th></tr><tr><td>Workstation</td><td>8.725,00 €</td></tr><tr><td>DS923+</td><td>545,38 €</td></tr><tr><td>4 × WD Red Pro</td><td>1.320,00 €</td></tr><tr><td>Systemkern</td><td><strong>10.590,38 €</strong></td></tr></table></div><div class=\"offer-note\">Netzwerk, USV und Arbeitsplatz-Upgrades bleiben separate Infrastrukturbausteine.</div></div>"}];function install(){var box=document.getElementById("pkgButtons"),stage=document.getElementById("infraStage");if(!box||!stage)return;box.innerHTML="";tiers.forEach(function(t,i){var b=document.createElement("button");b.className="pkg";b.innerHTML="<b>"+t.title+"</b><small>"+t.sub+"</small>";b.onclick=function(){box.querySelectorAll(".pkg").forEach(function(x){x.setAttribute("aria-pressed","false")});b.setAttribute("aria-pressed","true");stage.innerHTML=t.html};box.appendChild(b)});var bs=box.querySelectorAll(".pkg");if(bs[2]){bs[2].setAttribute("aria-pressed","true");stage.innerHTML=tiers[2].html}}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",install);else setTimeout(install,0)})();<\/script>';
