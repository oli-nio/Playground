<!doctype html>
<html><head><meta charset="utf-8"><title>Klimastation Dzud v9.4.2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>
<body style="margin:0;background:#efece4;font-family:system-ui,sans-serif">
<div id="boot" style="padding:24px;color:#555">Klimastation wird geladen…</div>
<script>
(async()=>{
  try{
    const parts=["html/part-00.txt", "html/part-01.txt", "html/part-02.txt", "html/part-03.txt", "html/part-04.txt", "html/part-05.txt", "html/part-06.txt", "html/part-07.txt"];
    let html="";
    for(const url of parts){
      const r=await fetch(url,{cache:"force-cache"});
      if(!r.ok) throw new Error(url+" "+r.status);
      html+=await r.text();
    }
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById("boot").textContent="Ladefehler: "+e;
    console.error(e);
  }
})();
</script></body></html>
