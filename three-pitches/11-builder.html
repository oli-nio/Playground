<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMIKAT — Bau dir eine Ausstellung</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0e0d;color:#f3efe6;font-family:Arial,Helvetica,sans-serif}canvas,svg{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:9;left:0;top:0;width:100%;display:flex;align-items:center;gap:18px;padding:20px 24px;mix-blend-mode:difference}.top b{letter-spacing:.12em}.top small{font:10px monospace;opacity:.7}.top a{margin-left:auto;color:inherit;text-decoration:none;border:1px solid;padding:7px 12px;border-radius:99px}.copy{position:fixed;z-index:8;left:24px;bottom:22px;max-width:min(760px,calc(100% - 48px));pointer-events:none}.copy em{font:11px monospace;font-style:normal;letter-spacing:.12em}.copy h1{font-size:clamp(42px,8vw,116px);letter-spacing:-.07em;line-height:.82;margin:12px 0 16px;text-wrap:balance}.copy p{font-size:clamp(14px,1.5vw,20px);max-width:620px;line-height:1.3}.badge{position:fixed;z-index:8;right:24px;bottom:22px;font:10px monospace;text-transform:uppercase}.hot{cursor:pointer}.hot:hover{filter:brightness(1.35)}@media(max-width:700px){.copy h1{font-size:50px}.badge{display:none}}#stage{position:fixed;inset:0;perspective:900px;transform-style:preserve-3d}#stage>*{position:absolute;transition:.7s cubic-bezier(.2,.8,.2,1)}</style></head><body><div class="top"><b>FORMIKAT</b><small>11 / 30 · 4x4 BUILDER</small><a href="index.html">ALLE 30</a></div><div id="stage"></div><div class="copy"><em>Mongolei Baukasten · EXPERIMENT</em><h1>Bau dir eine Ausstellung</h1><p>Module ziehen, drehen und zu einer eigenen Ausstellung koppeln.</p></div><div class="badge">builder · interaktiv</div><script>const s=document.querySelector('#stage');let parts=['STAB','KNOTEN','TEXTIL','SOCKEL','MONITOR','SOUND'];parts.forEach((n,j)=>{let e=document.createElement('div');e.textContent=n;e.draggable=true;e.style.cssText='left:'+(5+j*14)+'%;top:14%;padding:18px;background:'+['#ff5b38','#dfff42','#746cff'][j%3]+';color:#111';e.ondragstart=v=>v.dataTransfer.setData('text',n);s.append(e)});let z=document.createElement('div');z.style.cssText='left:15%;top:35%;width:70%;height:42%;border:2px dashed #fff6';z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();let p=document.createElement('b');p.textContent=e.dataTransfer.getData('text');p.style.cssText='position:absolute;left:'+(e.offsetX-30)+'px;top:'+(e.offsetY-20)+'px;padding:20px;background:#eee;color:#111;transform:rotate('+(Math.random()*.3-.15)+'rad)';z.append(p)};s.append(z)</script></body></html>
