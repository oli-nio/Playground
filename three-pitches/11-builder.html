idth:70%;height:42%;border:2px dashed #fff6';z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();place(z,e.dataTransfer.getData('text'),e.offsetX,e.offsetY)};z.onpointerdown=e=>{if(e.pointerType==='touch')place(z,selected,e.offsetX,e.offsetY)};s.append(z);let __ty=null;addEventListener('pointerdown',e=>{if(e.pointerType==='touch')__ty=e.clientY},{passive:true});addEventListener('pointerup',()=>__ty=null,{passive:true});addEventListener('pointercancel',()=>__ty=null,{passive:true});</script></body></html>
