<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMIKAT — Projekte werden Levels</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0e0d;color:#f3efe6;font-family:Arial,Helvetica,sans-serif}canvas,svg{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:9;left:0;top:0;width:100%;display:flex;align-items:center;gap:18px;padding:20px 24px;mix-blend-mode:difference}.top b{letter-spacing:.12em}.top small{font:10px monospace;opacity:.7}.top a{margin-left:auto;color:inherit;text-decoration:none;border:1px solid;padding:7px 12px;border-radius:99px}.copy{position:fixed;z-index:8;left:24px;bottom:22px;max-width:min(760px,calc(100% - 48px));pointer-events:none}.copy em{font:11px monospace;font-style:normal;letter-spacing:.12em}.copy h1{font-size:clamp(42px,8vw,116px);letter-spacing:-.07em;line-height:.82;margin:12px 0 16px;text-wrap:balance}.copy p{font-size:clamp(14px,1.5vw,20px);max-width:620px;line-height:1.3}.badge{position:fixed;z-index:8;right:24px;bottom:22px;font:10px monospace;text-transform:uppercase}.hot{cursor:pointer}.hot:hover{filter:brightness(1.35)}@media(max-width:700px){.copy h1{font-size:50px}.badge{display:none}}#stage{position:fixed;inset:0;perspective:900px;transform-style:preserve-3d}#stage>*{position:absolute;transition:.7s cubic-bezier(.2,.8,.2,1)}</style></head><body><div class="top"><b>FORMIKAT</b><small>22 / 30 · JAY RANSIJN</small><a href="index.html">ALLE 30</a></div><div id="stage"></div><div class="copy"><em>FORMIKAT Projekte · EXPERIMENT</em><h1>Projekte werden Levels</h1><p>Projekte als vertikale Level; Scrollen öffnet jeweils eine neue Regel.</p></div><div class="badge">levels · interaktiv</div><script>const s=document.querySelector('#stage');const names=['Nach den Maschinen','Zukunftswerkstatt','Total Real','MOVE!','Streit.','Im Steinbruch der Zeit','Willhelmgrill','Deltaslide'];names.forEach((n,j)=>{let e=document.createElement('article');e.innerHTML='<small>0'+(j+1)+'</small><h2>'+n+'</h2><p>Idee · Raum · Objekt · Umsetzung</p>';e.style.cssText='left:8%;top:'+(j*100+12)+'vh;width:84%;height:70vh;border-top:1px solid;padding:3vw;font-size:3vw;background:'+(j%2?'#eee;color:#111':'#111;color:#eee');s.append(e)});addEventListener('wheel',e=>{window.q=Math.max(0,Math.min(7,(window.q||0)+Math.sign(e.deltaY)));s.style.transform='translateY(-'+(window.q*100)+'vh) rotate('+(('levels'==='sequence')?window.q*.4:0)+'deg)'})</script></body></html>
