<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMIKAT — Die Website ist das erste Exponat</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0e0d;color:#f3efe6;font-family:Arial,Helvetica,sans-serif}canvas,svg{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:9;left:0;top:0;width:100%;display:flex;align-items:center;gap:18px;padding:20px 24px;mix-blend-mode:difference}.top b{letter-spacing:.12em}.top small{font:10px monospace;opacity:.7}.top a{margin-left:auto;color:inherit;text-decoration:none;border:1px solid;padding:7px 12px;border-radius:99px}.copy{position:fixed;z-index:8;left:24px;bottom:22px;max-width:min(760px,calc(100% - 48px));pointer-events:none}.copy em{font:11px monospace;font-style:normal;letter-spacing:.12em}.copy h1{font-size:clamp(42px,8vw,116px);letter-spacing:-.07em;line-height:.82;margin:12px 0 16px;text-wrap:balance}.copy p{font-size:clamp(14px,1.5vw,20px);max-width:620px;line-height:1.3}.badge{position:fixed;z-index:8;right:24px;bottom:22px;font:10px monospace;text-transform:uppercase}.hot{cursor:pointer}.hot:hover{filter:brightness(1.35)}@media(max-width:700px){.copy h1{font-size:50px}.badge{display:none}}#obj{position:fixed;left:35%;top:22%;width:30%;height:45%;background:#eee;border-radius:8px;box-shadow:0 30px 80px #000;transition:.5s;transform:perspective(700px) rotateX(55deg) rotateZ(-12deg)}#obj i{position:absolute;inset:15%;border:18px solid #ff5a38;border-radius:50%}#tools{position:fixed;right:24px;top:25%;display:grid;gap:8px}</style></head><body><div class="top"><b>FORMIKAT</b><small>24 / 30 · NOOMO SHOWCASE</small><a href="index.html">ALLE 30</a></div><div id="obj"><i></i></div><div id="tools"></div><div class="copy"><em>Deltaslide · EXPERIMENT</em><h1>Die Website ist das erste Exponat</h1><p>Das digitale Exponat reagiert auf Nähe, Licht und Berührung.</p></div><div class="badge">exhibit · interaktiv</div><script>const o=document.querySelector('#obj'),t=document.querySelector('#tools');['SALZ','STAHL','LICHT','OFFEN'].forEach((n,j)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{o.style.background=['#e8e2d3','#656b70','#dfff42','#ff5a38'][j];o.style.transform='perspective(700px) rotateX('+(15+j*18)+'deg) rotateZ('+(-15+j*8)+'deg) scale('+(1+j*.08)+')'};t.append(b)});addEventListener('pointermove',e=>o.style.filter='brightness('+(0.6+e.clientX/innerWidth)+')')</script></body></html>
