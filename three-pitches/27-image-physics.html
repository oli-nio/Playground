<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMIKAT — Das Bildarchiv bekommt Physik</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0e0d;color:#f3efe6;font-family:Arial,Helvetica,sans-serif}canvas,svg{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:9;left:0;top:0;width:100%;display:flex;align-items:center;gap:18px;padding:20px 24px;mix-blend-mode:difference}.top b{letter-spacing:.12em}.top small{font:10px monospace;opacity:.7}.top a{margin-left:auto;color:inherit;text-decoration:none;border:1px solid;padding:7px 12px;border-radius:99px}.copy{position:fixed;z-index:8;left:24px;bottom:22px;max-width:min(760px,calc(100% - 48px));pointer-events:none}.copy em{font:11px monospace;font-style:normal;letter-spacing:.12em}.copy h1{font-size:clamp(42px,8vw,116px);letter-spacing:-.07em;line-height:.82;margin:12px 0 16px;text-wrap:balance}.copy p{font-size:clamp(14px,1.5vw,20px);max-width:620px;line-height:1.3}.badge{position:fixed;z-index:8;right:24px;bottom:22px;font:10px monospace;text-transform:uppercase}.hot{cursor:pointer}.hot:hover{filter:brightness(1.35)}@media(max-width:700px){.copy h1{font-size:50px}.badge{display:none}}</style></head><body><div class="top"><b>FORMIKAT</b><small>27 / 30 · FRAMEMODE</small><a href="index.html">ALLE 30</a></div><canvas></canvas><div class="copy"><em>Projektarchiv · EXPERIMENT</em><h1>Das Bildarchiv bekommt Physik</h1><p>Projektbilder werfen, stapeln und kollidieren lassen.</p></div><div class="badge">physics · interaktiv</div><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let W,H,d=Math.min(devicePixelRatio,2),mx=.5,my=.5,t=0;function size(){W=c.width=innerWidth*d;H=c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(d,0,0,d,0,0)}size();addEventListener('resize',size);addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});let a=Array.from({length:18},(_,j)=>({x:40+(j%6)*150,y:40+Math.floor(j/6)*100,vx:0,vy:0,w:120,h:75,c:['#eee','#ff5a38','#dfff42','#756cff'][j%4]})),drag;addEventListener('pointerdown',e=>drag=a.find(o=>e.clientX>o.x&&e.clientX<o.x+o.w&&e.clientY>o.y&&e.clientY<o.y+o.h));addEventListener('pointerup',()=>drag=null);addEventListener('pointermove',e=>{if(drag){drag.x=e.clientX-drag.w/2;drag.y=e.clientY-drag.h/2;drag.vx=(mx-.5)*10}});function f(){requestAnimationFrame(f);x.fillStyle='#111';x.fillRect(0,0,innerWidth,innerHeight);a.forEach(o=>{if(o!==drag){o.vy+=.25;o.x+=o.vx;o.y+=o.vy;if(o.y+o.h>innerHeight){o.y=innerHeight-o.h;o.vy*=-.55}if(o.x<0||o.x+o.w>innerWidth)o.vx*=-1}x.fillStyle=o.c;x.fillRect(o.x,o.y,o.w,o.h)})}f()</script></body></html>
